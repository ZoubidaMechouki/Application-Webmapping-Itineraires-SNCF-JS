services:
  db:
    image: pgrouting/pgrouting:16-3.5-3.6
    container_name: itineraire-db
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
      - ./data:/data

  api:
    build: ./api
    container_name: itineraire-api
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  pgdata: